spring:
  datasource:
    hikari:
      maximum-pool-size: 1
    driver-class-name: org.postgresql.Driver
    username: user
    password: password

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  liquibase:
    enabled: false