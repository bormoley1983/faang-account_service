spring:
  task:
    scheduling:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: true

account:
  number:
    min-free: 10
    batch-size: 5
  prefixes:
    CHECKING: 6000
    SAVINGS: 5536
    CURRENCY: 7000
    DEBIT: 4200